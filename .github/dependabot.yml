version: 2

updates:
  # Runtime dependency (currently just @noble/post-quantum).
  # Reviews are weekly. Security updates are auto-opened by Dependabot's
  # security-updates feature, which is enabled at the repo level.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      include: scope
    # @noble/post-quantum 0.7.1 fails nine NIST ACVP SLH-DSA verification
    # vectors that 0.7.0 passes, returning false where the vectors require true,
    # so a package running it can reject a valid signature. Shipped in 1.5.1 and
    # reverted in 1.5.2. Reported upstream. Reproduce with:
    #   node conformance/run-acvp.mjs --set SLH-DSA-sigVer-FIPS205 --max-per-group 3
    # This blocks that one version only. 0.7.2 and later will still be proposed,
    # and should be accepted once the vectors pass again. The ACVP job would
    # catch it regardless; this stops the pull request being opened at all.
    ignore:
      - dependency-name: "@noble/post-quantum"
        versions: ["0.7.1"]

  # Pin updates for the actions used in our workflows. Dependabot will open
  # PRs proposing newer commit SHAs for actions/checkout etc, so we never
  # have to track upstream release notes by hand.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    # One pull request for all action bumps, not one each. On 7 Sep this opened
    # five separate PRs in a single morning - checkout, setup-node,
    # setup-python and both codeql-action paths - and every one of them was a
    # major bump the auto-merge step declines, so five reviews became five red
    # runs. Actions are pinned to commit SHAs and reviewed together anyway, so
    # the batch is how they are actually read. Security updates are opened by a
    # separate Dependabot feature and are not grouped by this.
    groups:
      github-actions:
        patterns:
          - "*"
