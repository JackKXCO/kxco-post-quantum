name: conformance

# Regenerates the published conformance evidence: NIST ACVP vectors for FIPS
# 203/204/205, and the cross-implementation interoperability matrix against
# liboqs (C), Bouncy Castle (Java) and dilithium-py / kyber-py (Python).
#
# This runs on every push and weekly, so CONFORMANCE.md describes what the code
# does now rather than what it did on the day someone ran the harness by hand.
# The reports are uploaded as artifacts on every run.
#
# ACVP vectors are pinned by commit and verified against the SHA-256 digests in
# conformance/acvp-lock.json; the interop peers are pinned in
# conformance/interop/peers-lock.json. A silently rewritten upstream fails the
# job rather than changing the result.
#
# The SLH-DSA signature sets cost roughly two orders of magnitude more than
# everything else: a full SLH-DSA-sigGen pass alone measured 76 minutes on a
# developer machine. They therefore run as their own job, in parallel with the
# cheap sets, with a timeout sized to that measurement rather than to hope. A
# single combined job would exceed its timeout on the weekly full run.
#
# Per-push runs subsample with --max-per-group; scheduled runs do a full pass.
# The generated report records which of the two it was, so a subsampled run is
# never mistaken for a full one.
#
# All third-party actions are pinned by 40-char commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acvp:
    name: ACVP ${{ matrix.group.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.group.timeout }}
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: key generation and ML-KEM/ML-DSA signatures
            slug: fast
            timeout: 45
            pushCap: 3
            sets: ML-KEM-keyGen-FIPS203,ML-KEM-encapDecap-FIPS203,ML-DSA-keyGen-FIPS204,ML-DSA-sigGen-FIPS204,ML-DSA-sigVer-FIPS204,SLH-DSA-keyGen-FIPS205
          - name: SLH-DSA signatures
            slug: slh-signatures
            timeout: 300
            # One case per group, not three: SLH-DSA signing is slow enough that
            # a per-push cap of 3 would put a ~30 minute job on every push.
            pushCap: 1
            sets: SLH-DSA-sigGen-FIPS205,SLH-DSA-sigVer-FIPS205
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - run: npm ci

      - name: Fetch and verify pinned ACVP vectors
        run: node conformance/fetch-vectors.mjs

      - name: Run ACVP vectors
        run: |
          REPORT=conformance/results/acvp-${{ matrix.group.slug }}.json
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node conformance/run-acvp.mjs --set '${{ matrix.group.sets }}' --json "$REPORT"
          else
            node conformance/run-acvp.mjs --set '${{ matrix.group.sets }}' --max-per-group ${{ matrix.group.pushCap }} --json "$REPORT"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: acvp-report-${{ matrix.group.slug }}
          path: conformance/results/acvp-${{ matrix.group.slug }}.json

  reproduce:
    # Rebuild the published tarball from its own tag and require a bit-for-bit
    # match against what the registry is serving. A provenance attestation says
    # a build happened in CI; this says the artefact is the source, which is a
    # different claim and the one a reader can check for themselves.
    #
    # Line endings are the trap. A checkout on a machine configured for CRLF
    # produces a different tarball from the same commit, so this must run on a
    # LF checkout. That is a property of the checkout, not of the build.
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Upgrade npm CLI to the 11.x line
        run: npm install -g npm@11

      - name: Rebuild the published version from its tag and compare
        run: |
          set -euo pipefail
          NAME=kxco-post-quantum
          VERSION=$(npm view "$NAME" version)
          echo "verifying $NAME@$VERSION"

          PUBLISHED=$(npm view "$NAME@$VERSION" dist.integrity)

          git clone --quiet --depth 1 --branch "v$VERSION"             "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/src
          cd /tmp/src
          npm ci --silent
          REBUILT=$(npm pack --json | node -e             'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].integrity))')

          echo "published: $PUBLISHED"
          echo "rebuilt  : $REBUILT"
          if [ "$PUBLISHED" != "$REBUILT" ]; then
            echo "::error::the published tarball does not reproduce from its tag"
            exit 1
          fi
          echo "match: the published tarball reproduces from source"

  bench:
    # Two architectures, on real hardware. Emulated ARM would produce numbers
    # that look like measurements and are not: QEMU timings say more about the
    # emulator than about the target, and a performance claim sourced from one
    # would be worse than publishing nothing.
    #
    # Both backends are covered implicitly by the Node version: 24 provides the
    # FIPS primitives through OpenSSL, and the harness measures whichever are
    # present and labels every row.
    name: Benchmark (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - run: npm ci

      - name: Measure
        run: |
          node --expose-gc bench/primitives.mjs             --iterations 100             --json bench/results/primitives-${{ matrix.arch }}.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ matrix.arch }}
          path: bench/results/primitives-${{ matrix.arch }}.json

  interop:
    # Both backends, because they are different implementations and a single run
    # cannot evidence both. Node 22 exercises the JavaScript backend; Node 24
    # exercises OpenSSL, which is what this package uses there. A green matrix on
    # one says nothing about the other, and the published report records which
    # one it ran.
    name: Cross-implementation interop (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    # A full matrix measured well under 30 minutes locally; the headroom is for a
    # slower runner, because a timeout here reads as failed interop rather than
    # as a slow machine.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install pinned Python interop peers
        run: |
          python -m pip install --disable-pip-version-check \
            $(node -e "console.log(require('./conformance/interop/peers-lock.json').python.requirements.join(' '))")

      # liboqs is C and is built from source into a container rather than
      # installed, so the tag in peers-lock.json is what actually gets tested.
      # Without this step the peer reports unavailable and the matrix silently
      # drops fourteen rows, which would read as a smaller pass count rather
      # than as a missing peer.
      - name: Build the liboqs interop peer image
        run: |
          LOCK=conformance/interop/peers-lock.json
          docker build             --build-arg LIBOQS_TAG=$(node -p "require('./$LOCK').liboqs.liboqs")             --build-arg LIBOQS_PYTHON_TAG=$(node -p "require('./$LOCK').liboqs.liboqs_python")             -f conformance/interop/peers/liboqs.Dockerfile             -t $(node -p "require('./$LOCK').liboqs.image")             conformance/interop/peers

      - name: Run interop matrix
        env:
          PYTHON: python
        run: node conformance/interop/run-interop.mjs --json conformance/results/interop.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: interop-report-node${{ matrix.node }}
          path: conformance/results/interop.json

  protocol:
    # Node 22 and 24 again, for the same reason the interop matrix runs both: the
    # verification path differs between backends, and a certificate that parses
    # under one is no evidence about the other.
    name: X.509 and CMS protocol conformance (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      # The artefacts are generated fresh on every run rather than committed. A
      # fixture would keep passing after an encoding drifted, which is the one
      # failure this job exists to catch.
      - name: Build the OpenSSL generator image
        run: |
          LOCK=conformance/interop/peers-lock.json
          docker build -f conformance/protocol/openssl.Dockerfile             -t $(node -p "require('./$LOCK').openssl.image")             conformance/protocol

      - name: Verify OpenSSL-issued certificates and signed messages
        run: node conformance/protocol/run-protocol.mjs --json conformance/results/protocol.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: protocol-report-node${{ matrix.node }}
          path: conformance/results/protocol.json

  dependencies:
    # The audit reads the lockfile, the registry and the installed tree. It is
    # cheap and it is the job most likely to catch a supply-chain change nobody
    # intended, so it runs on one Node version rather than a matrix.
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - run: npm ci

      # Fails if the tree has moved away from audit/dependency-review.json in
      # any respect: a new package, a bumped version, a floating range, an
      # install script, an advisory, a missing attestation, or a change in which
      # packages the published entry points can actually reach.
      - name: Audit every production dependency against the curated review
        run: node audit/run-audit.mjs --json audit/results/dependencies.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit-report
          path: audit/results/dependencies.json
