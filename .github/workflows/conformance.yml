name: conformance

# Regenerates the published conformance evidence: NIST ACVP vectors for FIPS
# 203/204/205, and the cross-implementation interoperability matrix against
# liboqs (C), Bouncy Castle (Java) and dilithium-py / kyber-py (Python).
#
# This runs on every push and weekly, so CONFORMANCE.md describes what the code
# does now rather than what it did on the day someone ran the harness by hand.
# The reports are uploaded as artifacts on every run.
#
# ACVP vectors are pinned by commit and verified against the SHA-256 digests in
# conformance/acvp-lock.json; the interop peers are pinned in
# conformance/interop/peers-lock.json. A silently rewritten upstream fails the
# job rather than changing the result.
#
# The SLH-DSA signature sets cost roughly two orders of magnitude more than
# everything else: a full SLH-DSA-sigGen pass alone measured 76 minutes on a
# developer machine. They therefore run as their own job, in parallel with the
# cheap sets, with a timeout sized to that measurement rather than to hope. A
# single combined job would exceed its timeout on the weekly full run.
#
# Per-push runs subsample with --max-per-group; scheduled runs do a full pass.
# The generated report records which of the two it was, so a subsampled run is
# never mistaken for a full one.
#
# All third-party actions are pinned by 40-char commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acvp:
    name: ACVP ${{ matrix.group.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.group.timeout }}
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: key generation and ML-KEM/ML-DSA signatures
            slug: fast
            timeout: 45
            pushCap: 3
            sets: ML-KEM-keyGen-FIPS203,ML-KEM-encapDecap-FIPS203,ML-DSA-keyGen-FIPS204,ML-DSA-sigGen-FIPS204,ML-DSA-sigVer-FIPS204,SLH-DSA-keyGen-FIPS205
          - name: SLH-DSA signatures
            slug: slh-signatures
            timeout: 300
            # One case per group, not three: SLH-DSA signing is slow enough that
            # a per-push cap of 3 would put a ~30 minute job on every push.
            pushCap: 1
            sets: SLH-DSA-sigGen-FIPS205,SLH-DSA-sigVer-FIPS205
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - run: npm ci

      - name: Fetch and verify pinned ACVP vectors
        run: node conformance/fetch-vectors.mjs

      - name: Run ACVP vectors
        run: |
          REPORT=conformance/results/acvp-${{ matrix.group.slug }}.json
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node conformance/run-acvp.mjs --set '${{ matrix.group.sets }}' --json "$REPORT"
          else
            node conformance/run-acvp.mjs --set '${{ matrix.group.sets }}' --max-per-group ${{ matrix.group.pushCap }} --json "$REPORT"
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: acvp-report-${{ matrix.group.slug }}
          path: conformance/results/acvp-${{ matrix.group.slug }}.json

  interop:
    name: Cross-implementation interop
    runs-on: ubuntu-latest
    # A full matrix measured well under 30 minutes locally; the headroom is for a
    # slower runner, because a timeout here reads as failed interop rather than
    # as a slow machine.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install pinned Python interop peers
        run: |
          python -m pip install --disable-pip-version-check \
            $(node -e "console.log(require('./conformance/interop/peers-lock.json').python.requirements.join(' '))")

      # liboqs is C and is built from source into a container rather than
      # installed, so the tag in peers-lock.json is what actually gets tested.
      # Without this step the peer reports unavailable and the matrix silently
      # drops fourteen rows, which would read as a smaller pass count rather
      # than as a missing peer.
      - name: Build the liboqs interop peer image
        run: |
          LOCK=conformance/interop/peers-lock.json
          docker build             --build-arg LIBOQS_TAG=$(node -p "require('./$LOCK').liboqs.liboqs")             --build-arg LIBOQS_PYTHON_TAG=$(node -p "require('./$LOCK').liboqs.liboqs_python")             -f conformance/interop/peers/liboqs.Dockerfile             -t $(node -p "require('./$LOCK').liboqs.image")             conformance/interop/peers

      - name: Run interop matrix
        env:
          PYTHON: python
        run: node conformance/interop/run-interop.mjs --json conformance/results/interop.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: interop-report
          path: conformance/results/interop.json
