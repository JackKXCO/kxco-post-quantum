name: CI

# Runs on every push and PR. Matrix over the Node versions we declare
# support for in package.json engines (>=20.19). All actions pinned by
# 40-char commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
      - run: npm test

      # Fuzz the parsing surfaces. Not the cryptography, which reviewed
      # implementations and 2,103 ACVP vectors already cover, but everything
      # that accepts bytes from somewhere else: JWS tokens, JWKs, PKCS#8 blobs,
      # signatures from a peer. The property is that a parser given arbitrary
      # bytes returns or throws a typed error, and that verification fails
      # closed rather than throwing or, worse, returning true.
      #
      # Deterministic by seed so a failure is reproducible, and it carries its
      # own control: if a genuine signature stops verifying, the run fails
      # rather than reporting a clean sweep it did not earn.
      - run: npm run fuzz
