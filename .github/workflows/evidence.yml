name: evidence

# Builds dist/evidence/ — the bundle handed to a customer's security team.
#
# Everything a security team needs to re-run our conformance results: versions,
# the commit, the toolchain, which backend actually did the maths, the ACVP and
# interoperability output, the bill of materials, and the audit history. Every
# result names the command that produced it, so any line can be re-run against
# the same commit.
#
# It runs on two runtimes on purpose. Node 22 has no OpenSSL 3.5 ML-DSA, so it
# exercises the JavaScript backend; Node 24 exercises OpenSSL. A bundle from
# one of them describes one implementation, and shipping only one would let a
# reader draw a conclusion about code that never ran.
#
# The push build subsamples ACVP groups and records that it did. The weekly and
# release builds do a full pass. A subsampled bundle is never presented as a
# full-suite claim.
#
# All third-party actions are pinned by 40-char commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  # contents: write is needed to attach the bundle to the GitHub Release.
  # An Actions artifact is not published evidence: it expires on the retention
  # window and needs an authenticated GitHub session to fetch, so an outside
  # assessor cannot read it at all. A release asset is a permanent
  # unauthenticated URL, which is the thing being claimed.
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    # FIPS 205 is capped rather than uncapped precisely so this stays bounded,
    # but SLH-DSA is slow enough that 45 was tight even without it.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # 22.x: no OpenSSL 3.5 FIPS primitives, so the JavaScript backend runs.
        # 24.x: OpenSSL 3.5, so the native backend runs.
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The bundle records the commit it describes, so a shallow clone with
          # no history would leave that field wrong rather than absent.
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'


      - run: npm ci

      - name: Install pinned Python interop peers
        run: |
          python -m pip install --disable-pip-version-check \
            $(node -e "console.log(require('./conformance/interop/peers-lock.json').python.requirements.join(' '))")

      # liboqs is C and is built from source into a container rather than
      # installed, so the tag in peers-lock.json is what actually gets tested.
      # Without this step the peer reports unavailable and the matrix silently
      # drops fourteen rows, which would read as a smaller pass count rather
      # than as a missing peer.
      - name: Build the liboqs interop peer image
        run: |
          LOCK=conformance/interop/peers-lock.json
          docker build             --build-arg LIBOQS_TAG=$(node -p "require('./$LOCK').liboqs.liboqs")             --build-arg LIBOQS_PYTHON_TAG=$(node -p "require('./$LOCK').liboqs.liboqs_python")             -f conformance/interop/peers/liboqs.Dockerfile             -t $(node -p "require('./$LOCK').liboqs.image")             conformance/interop/peers

      # Without this the ACVP vectors are simply absent on the runner and the
      # build dies. conformance.yml has always fetched them; this workflow never
      # did, which is why every run of it has failed at "Build evidence".
      - name: Fetch and verify pinned ACVP vectors
        run: node conformance/fetch-vectors.mjs

      - name: Record the backend under test
        run: |
          node -e "const {backend}=require('./src/backend.js');console.log(JSON.stringify(backend()))" \
            || node --input-type=module -e "import {backend} from './src/backend.js'; console.log(JSON.stringify(backend()))"

      # A full pass on a schedule or a release; subsampled on a push, because
      # SLH-DSA signature generation alone measured over an hour.
      - name: Build evidence
        env:
          PYTHON: python
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "release" ]; then
            npm run evidence:full
          else
            npm run evidence
          fi

      # The step above exits non-zero if a required step failed, so reaching
      # here means the bundle is complete. This asserts the bundle still states
      # which backend produced the results: two runtimes exercise different
      # code, and a bundle that does not say which one ran is ambiguous
      # evidence rather than evidence.
      - name: Assert the bundle names its backend
        run: |
          node -e "
            const m = require('./dist/evidence/00-MANIFEST.json');
            if (!m.backend || !m.backend.kind) {
              console.error('the manifest does not record which backend produced these results');
              process.exit(1);
            }
            if (!/reproducible/i.test(m.attestation || '')) {
              console.error('the manifest no longer states that the results are reproducible');
              process.exit(1);
            }
            console.log('backend recorded:', m.backend.kind);

            // The defect this guards: the README advertised FIPS 203/204/205
            // while the bundle carried only 203 and 204, because --full lifted
            // the per-group cap without widening a hardcoded set list. A
            // bundle narrower than the claim beside it is worse than a
            // narrower claim would have been, and nothing caught it.
            const full = m.sampling && m.sampling.full;
            if (full) {
              const fs = require('fs');
              const need = [
                '02-conformance-acvp.json',
                '02b-conformance-acvp-fips205.json',
                '02c-fips205-siggen-SAMPLED.md',
                '02d-conformance-acvp-fips205-siggen.json',
              ];
              const missing = need.filter((f) => !fs.existsSync('dist/evidence/' + f));
              if (missing.length) {
                console.error('a full bundle is missing: ' + missing.join(', '));
                console.error('the README claims FIPS 203/204/205; the bundle must show it');
                process.exit(1);
              }
              const f205 = require('./dist/evidence/02b-conformance-acvp-fips205.json');
              if (!f205.totals || f205.totals.failed !== 0 || f205.totals.passed < 1) {
                console.error('FIPS 205 section is empty or has failures: ' +
                  JSON.stringify(f205.totals));
                process.exit(1);
              }
              console.log('FIPS 205 present:', JSON.stringify(f205.totals));
            }
          "

      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: evidence-node${{ matrix.node }}
          path: dist/evidence/
          retention-days: 90

      # The bundle only counts as evidence if someone outside can fetch it.
      # The interop matrix, the ACVP results, the SBOM and the signature audit
      # all live in here, and an assessor reading only npm and the README sees
      # none of it.
      - name: Publish the evidence bundle on the GitHub Release
        if: github.event_name == 'release'
        # Not continue-on-error. This step silently did nothing on v1.6.1, so
        # releases/latest/download/manifest-node24.x.json 404s while the README
        # cites it as a permanent URL. A missing asset must fail the run.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist/evidence
          zip -qr "../../evidence-node${{ matrix.node }}.zip" .
          cd ../..
          gh release upload "$TAG"             "evidence-node${{ matrix.node }}.zip"             --clobber
          # The manifest goes up unzipped too, so the digests and the backend
          # that produced them can be read without downloading anything.
          cp dist/evidence/00-MANIFEST.json "manifest-node${{ matrix.node }}.json"
          gh release upload "$TAG" "manifest-node${{ matrix.node }}.json" --clobber
