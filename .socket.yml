version: 2

# https://docs.socket.dev/docs/socket-yml
# Escalate known-bad categories to hard errors; leave noisy-but-informational
# categories at warn so they surface in PRs without blocking CI.

issues:
  cve:
    action: error
  malware:
    action: error
  protestware:
    action: error
  new-author:
    action: warn
  install-scripts:
    action: warn
  telemetry:
    action: warn

# Dependency review. Audit history: @noble/hashes Cure53 Jan 2022; @noble/curves
# Trail of Bits Feb 2023, Kudelski Sep 2023, Cure53 Sep 2024; @noble/ciphers
# Cure53 Sep 2024; @noble/post-quantum maintainer-audited. Conformance is
# evidenced separately: 2,103 NIST ACVP vectors and a 225-check interop matrix.
ignore:
  - "@noble/post-quantum"
  - "@noble/hashes"
