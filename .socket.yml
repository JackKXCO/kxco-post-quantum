version: 2

# https://docs.socket.dev/docs/socket-yml
# Escalate known-bad categories to hard errors; leave noisy-but-informational
# categories at warn so they surface in PRs without blocking CI.

issues:
  cve:
    action: error
  malware:
    action: error
  protestware:
    action: error
  new-author:
    action: warn
  install-scripts:
    action: warn
  telemetry:
    action: warn

# Dependencies reviewed and accepted. NOT a statement that they were audited.
#
# @noble/post-quantum and @noble/hashes have no transitive runtime deps.
# @noble/hashes was audited by Cure53 in Jan 2022 (v1.0.0).
# @noble/post-quantum has been audited by NOBODY: self-audited by its
# maintainer only (v0.6.1, Apr 2026). An earlier version of this file said
# both were audited by Cure53 in 2024, which was wrong and contradicted this
# repository's own AUDIT.md. See audit/dependency-review.json for the record.
ignore:
  - "@noble/post-quantum"
  - "@noble/hashes"
